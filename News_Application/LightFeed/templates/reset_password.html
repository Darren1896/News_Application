{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter New Password</title>
    <link rel="stylesheet" href="{% static 'css/LightFeed.css' %}">
</head>
<body>
    <h2>Choose a New Password</h2>

    <!-- Dynamic Validation Messages -->
    {% if error %}
        <p style="color: red;"><strong>Error:</strong> {{ error }}</p>
    {% endif %}
    
    {% if success %}
        <p style="color: green; font-weight: bold;">{{ success }}</p>
        <p><a href="{% url 'LightFeed:login' %}">Click here to log in with your new password</a></p>
    {% else %}
        <!-- Notice the action points back to the tokenized URL path -->
        <form method="POST">
            {% csrf_token %}
            <div>
                <label for="password">New Password:</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <br>
            <div>
                <label for="confirm_password">Confirm New Password:</label>
                <input type="password" id="confirm_password" name="confirm_password">
            </div>
            <br>
            <button type="submit">Update Password</button>
        </form>
    {% endif %}
<footer>
    <p class="text-center">© 2026 LightFeed. All Rights Reserved</p>
</footer>
</body>
</html>
