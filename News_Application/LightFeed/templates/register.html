{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'css/LightFeed.css' %}">
</head>
<body>

<div class="container">
    <h2>Register An Account</h2>

    <!-- Error message display handled at the top for better visibility -->
    {% if error %}
        <div class="error-box">
            ⚠ {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'LightFeed:register' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div>
            <label for="confirm_password">Confirm New Password:</label>
            <input type="password" id="confirm_password" name="confirm_password">
        </div>
        
        <div class="form-group">
            <label for="role">Account Type:</label>
            <select id="role" name="role" required>
                <option value="Readers">Reader (Read articles and news)</option>
                <option value="Editors">Editor (Edit articles and news)</option>
                <option value="Journalists">Journalist (Create articles and news)</option>
            </select>
        </div>
        
        <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="{% url 'LightFeed:login' %}">Login here</a>
    </div>
</div>
    <footer>
        <p class="text-center">© 2026 LightFeed. All Rights Reserved</p>
    </footer>

</body>
</html>
