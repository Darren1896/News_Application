{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Password Reset</title>
    <link rel="stylesheet" href="{% static 'css/LightFeed.css' %}">
</head>
<body>
    <h2>Reset Your Password</h2>
    <p>Enter your email address below, and we will send you a link to reset your password.</p>

    <!-- Error Messaging Block -->
    {% if error %}
        <p style="color: red;"><strong>Error:</strong> {{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'LightFeed:request_password_reset' %}">
        {% csrf_token %}
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
        <button type="submit">Send Reset Link</button>
    </form>
    
    <p><a href="{% url 'LightFeed:login' %}">Back to Login</a></p>
    <footer>
        <p class="text-center">© 2026 LightFeed. All Rights Reserved</p>
    </footer>
</body>
</html>
