{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write New Article</title>
    <link rel="stylesheet" href="{% static 'css/LightFeed.css' %}">
</head>
<body>
<div class="container">
    <p><a href="{% url 'LightFeed:welcome' %}">← Back to Dashboard</a></p>
    <h1>Write New Article</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Article Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="pub_id">Assign to Publisher (optional)</label>
            <select id="pub_id" name="pub_id">
                <option value="">-- Publish Independently (no publisher) --</option>
                {% for publisher in publishers %}
                    <option value="{{ publisher.id }}">{{ publisher.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="content">Story Content</label>
            <textarea id="content" name="content" required></textarea>
        </div>

        <button type="submit">Send Story</button>
    </form>
    <footer>
        <p class="text-center">© 2026 LightFeed. All Rights Reserved</p>
    </footer>
</div>
</body>
</html>
