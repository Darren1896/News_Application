{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Link Sent</title>
    <link rel="stylesheet" href="{% static 'css/LightFeed.css' %}">
</head>
<body>
    <h2>Check Your Inbox</h2>
    
    {% if success %}
        <p style="color: green; font-weight: bold;">{{ success }}</p>
    {% endif %}
    
    <p>If an account exists with that email address, a password reset link has been sent to it.</p>
    <p><a href="{% url 'LightFeed:login' %}">Return to Login Page</a></p>
    <footer>
        <p class="text-center">© 2026 LightFeed. All Rights Reserved</p>
    </footer>
</body>
</html>
